[package]
name = "horae"
version = "0.2.3"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0"
description = "Capture a task in under 10 seconds. GTD terminal manager (ratatui TUI + CLI) with ~2 ms startup, reactive completions, recurring habits, pomodoro, and phone sync. Rust + SQLite, fully offline."
readme = "../../README.md"
repository = "https://github.com/zhaohang1205/horae"
keywords = ["gtd", "productivity", "tui", "pomodoro", "sqlite"]
categories = ["command-line-utilities", "database"]
default-run = "horae"

[[bin]]
name = "horae"
path = "src/main.rs"

[dependencies]
horae-core = { path = "../horae-core", version = "0.2.3" }
horae-tui = { path = "../horae-tui", version = "0.2.3" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
comfy-table = { version = "7", default-features = false, features = ["crossterm"] }
arboard = { version = "3", default-features = false }

[dev-dependencies]
horae-core = { path = "../horae-core", version = "0.2.3", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3.27"
